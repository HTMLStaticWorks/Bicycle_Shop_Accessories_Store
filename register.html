<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CycleNest</title>
  <meta name="description" content="Create an account on CycleNest">
  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#e0263a">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: var(--space-4);">
      <i class="ph ph-bicycle"></i> <span>Cycle<span>Nest</span></span>
    </a>
    <h2 style="margin-bottom: var(--space-2);">Join the Ride</h2>
    <p style="color: var(--text-light); margin-bottom: var(--space-4);">Create an account to book repairs & save favorite bikes</p>

    <button class="social-btn" aria-label="Sign up with Google">
      <i class="ph-fill ph-google-logo" style="color: #DB4437; font-size: 1.25rem;"></i> Continue with Google
    </button>
    <button class="social-btn" aria-label="Sign up with Apple">
      <i class="ph-fill ph-apple-logo" style="font-size: 1.25rem;"></i> Continue with Apple
    </button>

    <div style="display: flex; align-items: center; margin: var(--space-4) 0; color: var(--text-light);">
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
      <span style="padding: 0 var(--space-2); font-size: 0.875rem; text-transform: uppercase;">Or</span>
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
    </div>

    <form action="#" method="POST" id="registerForm">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Alex Rider" required>
        <span class="form-error">Name is required</span>
      </div>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="rider@example.com" required>
        <span class="form-error">Please enter a valid email</span>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        <span class="form-error">Password is required</span>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">Create Account</button>
    </form>

    <p style="margin-top: var(--space-4); font-size: 0.875rem;">
      Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login here</a>
    </p>
  </div>
</body>
</html>
