<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CycleNest">
  <defs>
    <linearGradient id="cn-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2465a"/>
      <stop offset="0.52" stop-color="#d81f33"/>
      <stop offset="1" stop-color="#a81224"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#cn-brand)"/>

  <g stroke="#fff" fill="none">
    <!-- teeth: one dashed ring, the same trick used by the motif-chainring token -->
    <circle cx="50" cy="50" r="36.5" stroke-width="7.6" stroke-dasharray="7.5 15.43" stroke-dashoffset="-7.72"/>
    <!-- ring body -->
    <circle cx="50" cy="50" r="29" stroke-width="9"/>
    <!-- spokes -->
    <g stroke-width="7.4" stroke-linecap="butt">
      <path d="M50 41V24"/>
      <path d="M50 41V24" transform="rotate(72 50 50)"/>
      <path d="M50 41V24" transform="rotate(144 50 50)"/>
      <path d="M50 41V24" transform="rotate(216 50 50)"/>
      <path d="M50 41V24" transform="rotate(288 50 50)"/>
    </g>
  </g>

  <!-- hub -->
  <circle cx="50" cy="50" r="9.5" fill="#fff"/>
</svg>
