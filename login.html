<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CycleNest</title>
  <meta name="description" content="Login to CycleNest">
  <!-- Favicon -->
  <link rel="icon" href="assets/images/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#e0263a">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body class="auth-page">
  <div class="auth-controls">
    <button class="theme-toggle" aria-label="Toggle Dark Mode"><i class="ph ph-moon"></i></button>
    <button class="rtl-toggle" aria-label="Toggle RTL"><i class="ph ph-arrows-left-right"></i></button>
  </div>

  <div class="auth-card">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: var(--space-4);">
      <i class="ph ph-bicycle"></i> <span>Cycle<span>Nest</span></span>
    </a>
    <h2 style="margin-bottom: var(--space-2);">Welcome Back</h2>
    <p style="color: var(--text-light); margin-bottom: var(--space-4);">Login to manage your rides and repairs</p>

    <form action="#" method="POST" id="loginForm">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="rider@example.com" required>
        <span class="form-error">Please enter a valid email</span>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-field">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <i class="ph ph-eye" aria-hidden="true"></i>
          </button>
        </div>
        <span class="form-error">Password is required</span>
      </div>
      <div class="auth-row">
        <label class="auth-remember">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="auth-link auth-forgot">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Login to Account</button>
    </form>

    <div style="display: flex; align-items: center; margin: var(--space-4) 0; color: var(--text-light);">
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
      <span style="padding: 0 var(--space-2); font-size: 0.875rem; text-transform: uppercase;">Or</span>
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
    </div>

    <button class="social-btn" aria-label="Login with Google">
      <svg class="social-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
        <path fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
        <path fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
      </svg>
      Continue with Google
    </button>
    <button class="social-btn" style="margin-bottom: 0;" aria-label="Login with Apple">
      <svg class="social-icon social-icon-apple" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"
        focusable="false">
        <path
          d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
      </svg>
      Continue with Apple
    </button>

    <p style="margin-top: var(--space-4); font-size: 0.875rem;">
      Don't have an account? <a href="register.html" class="auth-link">Register here</a>
    </p>


  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
