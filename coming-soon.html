<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - CycleNest</title>
  <meta name="description" content="CycleNest is launching soon">
  <!-- Favicon -->
  <link rel="icon" href="assets/images/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta name="theme-color" content="#e0263a">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .timer {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    .time-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.7);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      min-width: 90px;
    }
    .time-val {
      font-size: 2.5rem;
      font-family: var(--font-display);
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    .time-label {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 4px;
    }
    .form-control {
      background-color: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255, 255, 255, 0.45); }
  </style>
</head>
<body class="auth-page">
  <div style="text-align: center; max-width: 600px; padding: var(--space-4); z-index: 1;">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: var(--space-6); color: #fff;">
      <i class="ph ph-bicycle" style="font-size: 2.5rem;"></i> <span>Cycle<span>Nest</span></span>
    </a>
    
    <h1 style="margin-bottom: var(--space-4); color: #fff;">We're Gearing Up</h1>
    <p style="color: rgba(255,255,255,0.72); margin-bottom: var(--space-8); font-size: 1.125rem;">
      Our new shop and service center is opening soon. Get ready for the ultimate ride.
    </p>
    
    <div class="timer">
      <div class="time-box">
        <div class="time-val">14</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-box">
        <div class="time-val">08</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-box">
        <div class="time-val">45</div>
        <div class="time-label">Mins</div>
      </div>
    </div>
    
    <form action="#" method="POST" style="display: flex; gap: var(--space-2); max-width: 400px; margin: 0 auto;">
      <input type="email" class="form-control" placeholder="Enter your email to get notified" required>
      <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Notify Me</button>
    </form>
  </div>
</body>
</html>
